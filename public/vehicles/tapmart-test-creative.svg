<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1200" viewBox="0 0 2400 1200">
  <defs>
    <pattern id="g" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0323C"/>
      <stop offset="1" stop-color="#C41A24"/>
    </linearGradient>
  </defs>
  <!-- print boundary: the whole sheet is the vinyl -->
  <rect width="2400" height="1200" rx="36" fill="url(#bg)"/>
  <rect width="2400" height="1200" rx="36" fill="url(#g)"/>
  <rect x="30" y="30" width="2340" height="1140" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="6"/>
  <!-- registration marks -->
  <g stroke="#ffffff" stroke-width="6" fill="none">
    <path d="M90 140V90H140M2310 140V90H2260M90 1060v50h50M2310 1060v50h-50"/>
  </g>
  <!-- TapMart mark -->
  <g transform="translate(150 150)">
    <rect width="150" height="150" rx="34" fill="#ffffff"/>
    <rect x="42" y="42" width="66" height="66" rx="14" fill="#E0212B"/>
  </g>
  <text x="340" y="262" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="96" font-weight="700" fill="#ffffff" letter-spacing="-3">TapMart</text>
  <text x="340" y="322" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="40" font-weight="500" fill="#ffffff" fill-opacity="0.85" letter-spacing="8">CAR ADVERTISING</text>
  <!-- business -->
  <text x="150" y="620" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="230" font-weight="800" fill="#ffffff" letter-spacing="-10">Demo Coffee Co.</text>
  <text x="150" y="740" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="88" font-weight="500" fill="#ffffff" fill-opacity="0.95">Fresh roasts, every morning, Raleigh NC</text>
  <!-- cup graphic: a strong shape to judge curvature -->
  <g transform="translate(1930 330)">
    <circle r="250" fill="#ffffff" fill-opacity="0.16"/>
    <circle r="250" fill="none" stroke="#ffffff" stroke-width="10"/>
    <path d="M-120 -40h220v130a110 110 0 0 1-110 110h0a110 110 0 0 1-110-110z" fill="#ffffff"/>
    <path d="M100 -10h50a55 55 0 0 1 0 110h-50" fill="none" stroke="#ffffff" stroke-width="26"/>
    <path d="M-40 -120c0-40 40-40 40-80M20 -120c0-40 40-40 40-80M-100 -120c0-40 40-40 40-80" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
  </g>
  <!-- footer line: contact and offer -->
  <rect x="150" y="860" width="2100" height="4" fill="#ffffff" fill-opacity="0.6"/>
  <text x="150" y="990" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="78" font-weight="700" fill="#ffffff">democoffee.example  ·  (919) 555 0148</text>
  <text x="2250" y="990" text-anchor="end" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="66" font-weight="600" fill="#ffffff" fill-opacity="0.9">Show this car, get 20% off</text>
  <!-- edge labels to catch mirroring -->
  <text x="150" y="1110" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#ffffff" fill-opacity="0.7">LEFT EDGE</text>
  <text x="2250" y="1110" text-anchor="end" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#ffffff" fill-opacity="0.7">RIGHT EDGE</text>
</svg>
